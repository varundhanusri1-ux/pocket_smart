{% extends "base.html" %}
{% block title %}Testimonials · {{ APP_NAME }}{% endblock %}

{% block content %}
<div class="page-hero">
  <div class="container">
    <span class="section-eyebrow">Testimonials</span>
    <h1>Planners who trust PocketSmart AI</h1>
    <p>Real stories from people who turned a budget into a beautiful outcome.</p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="testimonial-grid testimonials-page-grid">
      <figure class="testimonial-card">
        <div class="stars">★★★★★</div>
        <blockquote>“We furnished our 2BHK for under ₹1.4L. The allocation view alone saved us from two bad purchases — we knew exactly how much decor could afford.”</blockquote>
        <figcaption><span class="avatar">P</span><div><strong>Priya Sharma</strong><span>Home Interior · Pune</span></div></figcaption>
      </figure>
      <figure class="testimonial-card">
        <div class="stars">★★★★★</div>
        <blockquote>“Planned my dad’s 60th for 80 guests. The catering vs decor split was exactly what I needed, and the per-guest math kept me honest.”</blockquote>
        <figcaption><span class="avatar">A</span><div><strong>Arjun Mehta</strong><span>Party Budget · Delhi</span></div></figcaption>
      </figure>
      <figure class="testimonial-card">
        <div class="stars">★★★★☆</div>
        <blockquote>“Uploaded my saree photo and got jhumka picks that actually matched the gold border. Under budget too.”</blockquote>
        <figcaption><span class="avatar">S</span><div><strong>Sneha Kulkarni</strong><span>Jewelry Stylist · Bengaluru</span></div></figcaption>
      </figure>
      <figure class="testimonial-card">
        <div class="stars">★★★★★</div>
        <blockquote>“As a wedding coordinator I plan 4 events a month. The per-category allocation is now my first draft for every client.”</blockquote>
        <figcaption><span class="avatar">R</span><div><strong>Rahul Verma</strong><span>Party Budget · Jaipur</span></div></figcaption>
      </figure>
      <figure class="testimonial-card">
        <div class="stars">★★★★★</div>
        <blockquote>“I moved into a studio and had ₹80k. The plan prioritized a multi-use sofa and lighting before decor — exactly the right order.”</blockquote>
        <figcaption><span class="avatar">N</span><div><strong>Nisha Patel</strong><span>Home Interior · Ahmedabad</span></div></figcaption>
      </figure>
      <figure class="testimonial-card">
        <div class="stars">★★★★☆</div>
        <blockquote>“My engagement look was sorted in minutes. The suggestions were labeled as AI guidance, which I appreciated — prices matched reality closely.”</blockquote>
        <figcaption><span class="avatar">K</span><div><strong>Kavya Reddy</strong><span>Jewelry Stylist · Hyderabad</span></div></figcaption>
      </figure>
    </div>

    <div class="center-cta">
      <a href="/register" class="btn btn-primary btn-lg">Start your own plan</a>
    </div>
  </div>
</section>
{% endblock %}
